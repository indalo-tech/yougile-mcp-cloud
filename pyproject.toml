[project]
name = "yougile-mcp-cloud"
version = "0.1.0"
description = "Hosted YouGile MCP: sign in with YouGile, per-company limits, permissions, trials"
requires-python = ">=3.14"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
authors = [{ name = "Indalo" }]
dependencies = [
    "yougile-mcp>=0.3.0",
    "psycopg[binary,pool]>=3.3.6",
    "valkey-glide>=2.5.2",
    "cryptography>=50",
    "uvicorn>=0.53",
    "python-multipart>=0.0.32",
]

[project.scripts]
yougile-cloud = "yougile_cloud.__main__:main"

[dependency-groups]
dev = [
    "pytest>=9.1",
    "pytest-asyncio>=1.4",
    "ruff>=0.16",
]

# PyPI's index still listed only 0.2.0 for a while after 0.3.0 was uploaded (a stale CDN
# cache), so the release wheel is pinned by URL; uv.lock holds its hash. Drop this section
# and run `uv lock` once https://pypi.org/simple/yougile-mcp/ shows 0.3.0.
[tool.uv.sources]
yougile-mcp = { url = "https://files.pythonhosted.org/packages/f3/8f/7482cb2f84df29a9bce2ebcda28f78f70f7e70b9f67cac5b253abc6feb36/yougile_mcp-0.3.0-py3-none-any.whl" }

[build-system]
requires = ["hatchling>=1.32"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/yougile_cloud"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
filterwarnings = ["ignore:Importing from 'glide:DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "S"]
ignore = ["S101"]  # asserts are fine in tests

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106", "S107"]
