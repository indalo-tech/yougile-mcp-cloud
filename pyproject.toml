[project]
name = "yougile-mcp-cloud"
version = "0.1.0"
description = "Hosted YouGile MCP: sign in with YouGile, per-company limits, permissions, trials"
requires-python = ">=3.14"
authors = [{ name = "Indalo" }]
dependencies = [
    "yougile-mcp>=0.3.0",
    "psycopg[binary,pool]>=3.3.6",
    "valkey-glide>=2.5.2",
    "cryptography>=50",
    "uvicorn>=0.53",
    "python-multipart>=0.0.32",
]

[project.scripts]
yougile-cloud = "yougile_cloud.__main__:main"

[dependency-groups]
dev = [
    "pytest>=9.1",
    "pytest-asyncio>=1.4",
    "ruff>=0.16",
]

# Until yougile-mcp 0.3.0 is on PyPI the core comes from the sibling checkout.
[tool.uv.sources]
yougile-mcp = { path = "../yougile-mcp", editable = true }

[build-system]
requires = ["hatchling>=1.32"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/yougile_cloud"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
filterwarnings = ["ignore:Importing from 'glide:DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "S"]
ignore = ["S101"]  # asserts are fine in tests

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106"]
