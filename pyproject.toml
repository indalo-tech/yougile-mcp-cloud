[project]
name = "yougile-mcp-cloud"
version = "0.1.0"
description = "Hosted YouGile MCP: sign in with YouGile, per-company limits, permissions, trials"
requires-python = ">=3.14"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
authors = [{ name = "Indalo" }]
dependencies = [
    "yougile-mcp>=0.7.0",
    "psycopg[binary,pool]>=3.3.6",
    "valkey-glide>=2.5.2",
    "cryptography>=50",
    "uvicorn>=0.53",
    "python-multipart>=0.0.32",
]

[project.scripts]
yougile-cloud = "yougile_cloud.__main__:main"

[dependency-groups]
dev = [
    "pytest>=9.1",
    "pytest-asyncio>=1.4",
    "ruff>=0.16",
]

# PyPI's index (a CDN cache) shows a new yougile-mcp release only after a long delay, so a
# fresh release wheel is pinned by URL; uv.lock holds its hash. Drop this section and run
# `uv lock` once https://pypi.org/simple/yougile-mcp/ lists the pinned version.
[tool.uv.sources]
yougile-mcp = { url = "https://files.pythonhosted.org/packages/c6/e1/e3638e07241a905014b2afe1ce3c8657d618ddf97035c16e08f167cabbaf/yougile_mcp-0.7.0-py3-none-any.whl" }

[build-system]
requires = ["hatchling>=1.32"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/yougile_cloud"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
filterwarnings = ["ignore:Importing from 'glide:DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "S"]
ignore = ["S101"]  # asserts are fine in tests

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106", "S107"]
